# fly.toml app configuration file generated for uoftexplorer on 2026-06-14T12:30:44-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'uoftexplorer'
primary_region = 'yyz'

# [build]
# dockerfile = "Dockerfile"
# ignorefile = ".dockerignore"

[build]
image = "ghcr.io/andrei-akopian/uoftexplorer:minimal"

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 512
